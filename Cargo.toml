[package]
name = "m-webshell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The keep for your web terminal — time-based one-time password gate for a local ttyd child"

[[bin]]
name = "m-webshell"
path = "src/main.rs"

[lib]
name = "m_webshell"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
governor = "0.6"
http = "1.1"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.3", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
percent-encoding = "2.3"
qrcode = "0.14"
regex = "1.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
totp-rs = { version = "5.6", features = ["qr"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
tower-service = "0.3"
tracing = "0.1"
futures-util = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tempfile = "3.10"
totp-rs = "5.6"

[profile.release]
opt-level = 3
lto = true

[package.metadata.deb]
maintainer = "mufkuw"
copyright = "2026, mufkuw"
license-file = ["LICENSE", "0"]
depends = "$auto, ttyd"
section = "net"
priority = "optional"
assets = [
    ["target/release/m-webshell", "usr/local/bin/m-webshell", "755"],
    ["m-webshell.service", "etc/systemd/system/m-webshell.service", "644"],
    ["README.md", "usr/share/doc/m-webshell/README.md", "644"],
]
maintainer-scripts = "debian/scripts"
conf-files = [
    "/etc/systemd/system/m-webshell.service",
]
